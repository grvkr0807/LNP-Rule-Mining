# Portable environment specification for the SAR NM Iterative workflow.
# Curated from the complete Linux x86-64 Conda environment export.
# Exact Conda build strings, low-level system libraries, and machine-specific
# installation paths are intentionally omitted for portability.
#
# For the complete environment snapshot, see:
# SAR_NM_Feature_Refinement_environment_full_linux_x86_64.yml

name: sar-nm-feature-refinement

channels:
  - conda-forge
  - rmg

dependencies:
  - python=3.8.18

  # Core numerical and data-analysis stack
  - numpy=1.24.3
  - pandas=2.0.3
  - scipy=1.10.1
  - scikit-learn=1.3.2
  - imbalanced-learn=0.12.4
  - joblib=1.4.2

  # Molecular featurization and interpretation
  - rdkit=2023.09.1
  - deepchem=2.8.0
  - descriptastorus=2.2.0
  - shap=0.44.1

  # Plotting and tabular output
  - matplotlib-base=3.7.3
  - openpyxl=3.0.10
  - xlsxwriter=3.2.0
  - wordcloud=1.9.3

  # Utilities used by the computational workflow
  - tqdm=4.67.1
  - pyyaml=6.0.2
  - pip=24.3.1

  # Model libraries installed with pip in the source environment
  - pip:
      - lightgbm==4.6.0
      - xgboost==2.1.4
      - catboost==1.2.10
      - graphviz==0.20.3
      - plotly==6.9.0
